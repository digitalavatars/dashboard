    function App() {
      const [selectedDay, setSelectedDay] = useState(3);
      const [activeSection, setActiveSection] = useState('rhythm');

      // URL веб-приложения Google Apps Script
      const [scriptUrl, setScriptUrl] = useState(() => {
        return DEFAULT_SCRIPT_URL || localStorage.getItem('neuro_gas_url') || '';
      });
      const [showSyncModal, setShowSyncModal] = useState(false);
      const [tempUrlInput, setTempUrlInput] = useState(scriptUrl);
      const [syncStatus, setSyncStatus] = useState(scriptUrl ? 'Готово к синхронизации' : 'Локальный режим');
      const isInitialFetchDone = useRef(false);

      const [habits, setHabits] = useState(() => {
        const saved = localStorage.getItem('neuro_habits_v1');
        return saved ? JSON.parse(saved) : INITIAL_HABITS;
      });
      const [dailyGoals, setDailyGoals] = useState(() => {
        const saved = localStorage.getItem('neuro_goals_v1');
        return saved ? JSON.parse(saved) : INITIAL_DAILY_GOALS;
      });
      const [leads, setLeads] = useState(() => {
        const saved = localStorage.getItem('neuro_leads_v1');
        return saved ? JSON.parse(saved) : INITIAL_LEADS;
      });
      const [kazna, setKazna] = useState(() => {
        const saved = localStorage.getItem('neuro_kazna_v1');
        return saved ? JSON.parse(saved) : INITIAL_KAZNA;
      });

      // Загрузка состояния из Google Таблицы
      const pullFromGoogleSheet = async (urlToUse = scriptUrl) => {
        if (!urlToUse) return;
        try {
          setSyncStatus('Загрузка из Таблицы...');
          const res = await fetch(urlToUse);
          const data = await res.json();
          if (data && data.state) {
            if (data.state.habits) setHabits(data.state.habits);
            if (data.state.dailyGoals) setDailyGoals(data.state.dailyGoals);
            if (data.state.leads) setLeads(data.state.leads);
            if (data.state.kazna) setKazna(data.state.kazna);
            setSyncStatus('Синхронизировано с Таблицей ✓');
          } else {
            // Если в таблице ещё пусто — сразу запишем туда текущие данные
            await pushToGoogleSheet({ habits, dailyGoals, leads, kazna }, urlToUse);
          }
          isInitialFetchDone.current = true;
        } catch (err) {
          console.error('Ошибка чтения из Google Таблицы:', err);
          setSyncStatus('Ошибка связи с Таблицей');
        }
      };

      // Отправка изменений в Google Таблицу (text/plain обходит CORS preflight в Apps Script)
      const pushToGoogleSheet = async (payload, urlToUse = scriptUrl) => {
        if (!urlToUse) return;
        try {
          setSyncStatus('Сохранение в Таблицу...');
          await fetch(urlToUse, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload),
          });
          setSyncStatus('Сохранено в Таблице ✓');
        } catch (err) {
          console.error('Ошибка записи в Google Таблицу:', err);
          setSyncStatus('Ошибка сохранения');
        }
      };

      // При первом открытии подтягиваем свежие галочки из Google Таблицы
      useEffect(() => {
        if (scriptUrl) {
          pullFromGoogleSheet(scriptUrl);
        }
      }, [scriptUrl]);

      // Автоматическое сохранение при любом клике (и локально, и в Google Таблицу)
      useEffect(() => {
        localStorage.setItem('neuro_habits_v1', JSON.stringify(habits));
        localStorage.setItem('neuro_goals_v1', JSON.stringify(dailyGoals));
        localStorage.setItem('neuro_leads_v1', JSON.stringify(leads));
        localStorage.setItem('neuro_kazna_v1', JSON.stringify(kazna));

        if (scriptUrl && isInitialFetchDone.current) {
          const timer = setTimeout(() => {
            pushToGoogleSheet({ habits, dailyGoals, leads, kazna }, scriptUrl);
          }, 400);
          return () => clearTimeout(timer);
        }
      }, [habits, dailyGoals, leads, kazna]);

      const handleSaveScriptUrl = (e) => {
        e.preventDefault();
        const cleaned = tempUrlInput.trim();
        localStorage.setItem('neuro_gas_url', cleaned);
        setScriptUrl(cleaned);
        setShowSyncModal(false);
        if (cleaned) pullFromGoogleSheet(cleaned);
      };

      const [newGoalText, setNewGoalText] = useState('');
      const [newHabitTitle, setNewHabitTitle] = useState('');
      const [newHabitCategory, setNewHabitCategory] = useState('Продажи');
      const [newHabitTarget, setNewHabitTarget] = useState(1);
      const [showAddHabit, setShowAddHabit] = useState(false);
      const [editingNoteId, setEditingNoteId] = useState(null);

      const [targetRevenue, setTargetRevenue] = useState(30000);
      const [ticketPrice, setTicketPrice] = useState(5000);
      const [statusFilter, setStatusFilter] = useState('Все');

      const getDayCompletionStats = (dayIdx) => {
        const dayTasks = dailyGoals[dayIdx] || [];
        const completedTasks = dayTasks.filter((t) => t.done).length;
        const totalTasks = dayTasks.length;
        const totalItems = habits.length + totalTasks;
        const completedHabitsCount = habits.filter((h) => (h.history[dayIdx] || 0) >= h.targetPerDay).length;
        const completedItems = completedHabitsCount + completedTasks;
        const percentage = totalItems > 0 ? Math.round((completedItems / totalItems) * 100) : 0;

        return {
          percentage,
          completedHabitsCount,
          totalHabitsCount: habits.length,
          completedTasks,
          totalTasks,
        };
      };

      const weeklyStats = useMemo(() => {
        return WEEK_DAYS.map((d) => ({
          ...d,
          ...getDayCompletionStats(d.id),
        }));
      }, [habits, dailyGoals]);

      const currentDayStats = weeklyStats[selectedDay];

      const getHabitStreak = (habit) => {
        let currentStreak = 0;
        for (let i = selectedDay; i >= 0; i--) {
          if ((habit.history[i] || 0) >= habit.targetPerDay) currentStreak++;
          else break;
        }
        let bestStreak = 0, temp = 0;
        for (let i = 0; i < 7; i++) {
          if ((habit.history[i] || 0) >= habit.targetPerDay) {
            temp++;
            if (temp > bestStreak) bestStreak = temp;
          } else temp = 0;
        }
        return { currentStreak, bestStreak };
      };

      const globalMetrics = useMemo(() => {
        const avgCompletion = Math.round(
          weeklyStats.slice(0, selectedDay + 1).reduce((acc, s) => acc + s.percentage, 0) / (selectedDay + 1)
        );
        let maxStreakHabit = habits[0] || { title: '—' };
        let maxStreakVal = 0;
        habits.forEach((h) => {
          const { bestStreak } = getHabitStreak(h);
          if (bestStreak > maxStreakVal) {
            maxStreakVal = bestStreak;
            maxStreakHabit = h;
          }
        });

        const paidRevenue = leads.filter((l) => l.status === 'Оплатил').reduce((sum, l) => sum + l.amount, 0);
        const pipelineRevenue = leads
          .filter((l) => l.status === 'Дожим' || l.status === 'Договорились' || l.status === 'Ответил')
          .reduce((sum, l) => sum + l.amount, 0);

        return {
          avgCompletion,
          maxStreakVal,
          maxStreakHabitTitle: maxStreakHabit.title,
          paidRevenue,
          pipelineRevenue,
        };
      }, [weeklyStats, habits, selectedDay, leads]);

      const toggleHabitProgress = (habitId, dayIdx = selectedDay, delta = null) => {
        isInitialFetchDone.current = true;
        setHabits((prev) =>
          prev.map((h) => {
            if (h.id !== habitId) return h;
            const nextHistory = [...h.history];
            const currentVal = nextHistory[dayIdx] || 0;
            if (delta !== null) {
              nextHistory[dayIdx] = Math.max(0, Math.min(h.targetPerDay, currentVal + delta));
            } else {
              nextHistory[dayIdx] = h.targetPerDay === 1
                ? (currentVal >= 1 ? 0 : 1)
                : (currentVal >= h.targetPerDay ? 0 : currentVal + 1);
            }
            return { ...h, history: nextHistory };
          })
        );
      };

      const updateHabitNote = (habitId, noteText) => {
        isInitialFetchDone.current = true;
        setHabits((prev) =>
          prev.map((h) => (h.id !== habitId ? h : { ...h, notes: { ...h.notes, [selectedDay]: noteText } }))
        );
      };

      const handleAddHabit = (e) => {
        e.preventDefault();
        if (!newHabitTitle.trim()) return;
        isInitialFetchDone.current = true;
        setHabits((prev) => [
          ...prev,
          {
            id: `h-${Date.now()}`,
            title: newHabitTitle.trim(),
            category: newHabitCategory,
            iconName: 'sparkles',
            targetPerDay: Math.max(1, Math.min(10, Number(newHabitTarget) || 1)),
            unit: 'раз',
            color: '#2D6A4F',
            badgeNote: 'новая привычка',
            history: [0, 0, 0, 0, 0, 0, 0],
            notes: {},
          },
        ]);
        setNewHabitTitle('');
        setShowAddHabit(false);
      };

      const deleteHabit = (habitId) => {
        isInitialFetchDone.current = true;
        setHabits((prev) => prev.filter((h) => h.id !== habitId));
      };

      const toggleGoal = (goalId) => {
        isInitialFetchDone.current = true;
        setDailyGoals((prev) => ({
          ...prev,
          [selectedDay]: (prev[selectedDay] || []).map((g) => (g.id === goalId ? { ...g, done: !g.done } : g)),
        }));
      };

      const handleAddGoal = (e) => {
        e.preventDefault();
        if (!newGoalText.trim()) return;
        isInitialFetchDone.current = true;
        setDailyGoals((prev) => ({
          ...prev,
          [selectedDay]: [
            ...(prev[selectedDay] || []),
            { id: `g-${Date.now()}`, text: newGoalText.trim(), done: false, priority: 'high', tag: 'Фокус дня' },
          ],
        }));
        setNewGoalText('');
      };

      const deleteGoal = (goalId) => {
        isInitialFetchDone.current = true;
        setDailyGoals((prev) => ({
          ...prev,
          [selectedDay]: (prev[selectedDay] || []).filter((g) => g.id !== goalId),
        }));
      };

      const cycleLeadStatus = (leadId) => {
        isInitialFetchDone.current = true;
        setLeads((prev) =>
          prev.map((l) => {
            if (l.id !== leadId) return l;
            const idx = LEAD_STATUSES.indexOf(l.status);
            return { ...l, status: LEAD_STATUSES[(idx + 1) % LEAD_STATUSES.length] };
          })
        );
      };

      const toggleKaznaNeed = (id) => {
        isInitialFetchDone.current = true;
        setKazna((prev) => ({
          ...prev,
          needs: prev.needs.map((n) => (n.id === id ? { ...n, done: !n.done } : n)),
        }));
      };

      const chartPoints = useMemo(() => {
        const width = 560, height = 165, padX = 32, padY = 24;
        const usableW = width - padX * 2, usableH = height - padY * 2;
        return weeklyStats.map((stat, idx) => ({
          x: padX + (idx / 6) * usableW,
          y: padY + usableH - (stat.percentage / 100) * usableH,
          ...stat,
        }));
      }, [weeklyStats]);

      const svgPath = useMemo(() => {
        if (chartPoints.length === 0) return '';
        let d = `M ${chartPoints[0].x} ${chartPoints[0].y}`;
        for (let i = 0; i < chartPoints.length - 1; i++) {
          const curr = chartPoints[i], next = chartPoints[i + 1];
          const ctrlX1 = curr.x + (next.x - curr.x) * 0.45;
          const ctrlX2 = curr.x + (next.x - curr.x) * 0.55;
          d += ` C ${ctrlX1} ${curr.y}, ${ctrlX2} ${next.y}, ${next.x} ${next.y}`;
        }
        return d;
      }, [chartPoints]);

      const svgAreaPath = useMemo(() => {
        if (!svgPath || chartPoints.length === 0) return '';
        return `${svgPath} L ${chartPoints[chartPoints.length - 1].x} 148 L ${chartPoints[0].x} 148 Z`;
      }, [svgPath, chartPoints]);

      const filteredLeads = useMemo(() => {
        if (statusFilter === 'Все') return leads;
        return leads.filter((l) => l.status === statusFilter);
      }, [leads, statusFilter]);

      return (
        <div className="min-h-screen" style={{ fontFamily: "'Plus Jakarta Sans', sans-serif" }}>
          <div className="h-1.5 w-full bg-gradient-to-r from-[#2D6A4F] via-[#52B788] to-[#D97706]" />

          <div className="max-w-[1280px] mx-auto px-4 sm:px-6 lg:px-8 py-7">
            {/* ШАПКА С ИНДИКАТОРОМ GOOGLE ТАБЛИЦЫ */}
            <header className="flex flex-col lg:flex-row lg:items-end justify-between gap-6 pb-7 border-b border-[#E7E2DA]">
              <div>
                <div className="flex flex-wrap items-center gap-2 mb-3">
                  <span className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#EFECE6] text-[#57534E] text-xs font-medium">
                    <span>Неделя 12.10 – 18.10</span>
                  </span>

                  <button
                    onClick={() => setShowSyncModal(!showSyncModal)}
                    className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold border transition-all ${
                      scriptUrl
                        ? 'bg-[#ECFDF5] text-[#2D6A4F] border-[#B7E4C7]'
                        : 'bg-[#FEF3C7] text-[#B45309] border-[#F59E0B]/40'
                    }`}
                  >
                    <span>{scriptUrl ? `🟢 ${syncStatus}` : '⚡ Подключить Google Таблицу'}</span>
                  </button>

                  {scriptUrl && (
                    <button
                      onClick={() => pullFromGoogleSheet(scriptUrl)}
                      className="px-2.5 py-1 rounded-full bg-[#EFECE6] hover:bg-[#E5E0D8] text-xs font-medium text-[#57534E]"
                      title="Обновить данные из таблицы"
                    >
                      ↻ Обновить
                    </button>
                  )}
                </div>

                {/* Модальное окно ввода ссылки Apps Script */}
                {showSyncModal && (
                  <form onSubmit={handleSaveScriptUrl} className="mb-4 p-4 rounded-2xl bg-[#FFFDF9] border border-[#2D6A4F] shadow-md max-w-xl space-y-2.5">
                    <div className="text-xs font-semibold text-[#1C1917]">
                      Вставь ссылку Web App URL из Google Таблицы (Расширения → Apps Script → Начать развертывание):
                    </div>
                    <input
                      type="url"
                      value={tempUrlInput}
                      onChange={(e) => setTempUrlInput(e.target.value)}
                      placeholder="https://script.google.com/macros/s/.../exec"
                      className="w-full px-3 py-2 text-xs bg-[#FAF8F5] border border-[#E7E2DA] rounded-xl font-mono"
                    />
                    <div className="flex items-center justify-end gap-2">
                      <button
                        type="button"
                        onClick={() => setShowSyncModal(false)}
                        className="px-3 py-1.5 rounded-xl text-xs text-[#78716C]"
                      >
                        Отмена
                      </button>
                      <button
                        type="submit"
                        className="px-4 py-1.5 rounded-xl bg-[#2D6A4F] text-white text-xs font-semibold"
                      >
                        Подключить и синхронизировать
                      </button>
                    </div>
                  </form>
                )}

                <h1 className="text-3xl sm:text-4xl font-semibold tracking-tight text-[#1C1917]" style={{ fontFamily: "'Newsreader', Georgia, serif" }}>
                  Ритм & Фокус • <span className="italic font-normal text-[#2D6A4F]">Нейротентика</span>
                </h1>
                <p className="mt-1.5 text-sm sm:text-base text-[#78716C] max-w-2xl">
                  {WEEK_DAYS[selectedDay].full}, {WEEK_DAYS[selectedDay].date} — {WEEK_DAYS[selectedDay].planNote}
                </p>
              </div>

              <div className="flex flex-wrap items-center gap-3">
                <div className="bg-[#FFFDF9] border border-[#E7E2DA] rounded-2xl px-4 py-3 shadow-sm flex items-center gap-3.5">
                  <div>
                    <div className="text-[11px] uppercase tracking-wider font-semibold text-[#78716C]">Оплачено / План 30к</div>
                    <div className="text-lg font-semibold text-[#1C1917] flex items-baseline gap-1.5" style={{ fontFamily: "'JetBrains Mono', monospace" }}>
                      <span>{(globalMetrics.paidRevenue / 1000).toFixed(0)}к ₽</span>
                      <span className="text-xs font-normal text-[#2D6A4F] bg-[#ECFDF5] px-1.5 py-0.5 rounded-md">
                        +{Math.round(globalMetrics.pipelineRevenue / 1000)}к в дожиме
                      </span>
                    </div>
                  </div>
                </div>

                <div className="bg-[#FFFDF9] border border-[#E7E2DA] rounded-2xl px-4 py-2.5 shadow-sm flex items-center gap-3.5">
                  <div className="relative w-12 h-12 flex items-center justify-center">
                    <svg className="w-12 h-12 -rotate-90" viewBox="0 0 48 48">
                      <circle cx="24" cy="24" r="19" fill="none" stroke="#EFECE6" strokeWidth="4.5" />
                      <circle
                        cx="24" cy="24" r="19" fill="none" stroke="#2D6A4F" strokeWidth="4.5" strokeLinecap="round"
                        strokeDasharray={2 * Math.PI * 19}
                        strokeDashoffset={2 * Math.PI * 19 * (1 - currentDayStats.percentage / 100)}
                      />
                    </svg>
                    <span className="absolute text-xs font-semibold text-[#1C1917]" style={{ fontFamily: "'JetBrains Mono', monospace" }}>
                      {currentDayStats.percentage}%
                    </span>
                  </div>
                  <div>
                    <div className="text-[11px] uppercase tracking-wider font-semibold text-[#78716C]">
                      Ритм дня ({WEEK_DAYS[selectedDay].short})
                    </div>
                    <div className="text-xs text-[#57534E] font-medium mt-0.5">
                      {currentDayStats.completedHabitsCount}/{currentDayStats.totalHabitsCount} привычек • {currentDayStats.completedTasks}/{currentDayStats.totalTasks} задач
                    </div>
                  </div>
                </div>
              </div>
            </header>

            {/* ПЕРЕКЛЮЧАТЕЛЬ ДНЕЙ И ВКЛАДОК */}
            <div className="mt-6 flex flex-col xl:flex-row xl:items-center justify-between gap-4">
              <div className="grid grid-cols-7 gap-2 flex-1">
                {weeklyStats.map((day) => {
                  const isSelected = day.id === selectedDay;
                  return (
                    <button
                      key={day.id}
                      onClick={() => setSelectedDay(day.id)}
                      className={`flex flex-col items-center py-2.5 px-2 rounded-2xl border transition-all duration-150 ${
                        isSelected
                          ? 'bg-[#1C1917] text-[#FAF8F5] border-[#1C1917] shadow-md'
                          : 'bg-[#FFFDF9] text-[#1C1917] border-[#E7E2DA] hover:bg-[#F5F2EB]'
                      }`}
                    >
                      <span className={`text-xs font-semibold uppercase ${isSelected ? 'text-[#A8A29E]' : 'text-[#78716C]'}`}>
                        {day.short}
                      </span>
                      <span className="text-xs sm:text-sm font-medium mt-0.5" style={{ fontFamily: "'JetBrains Mono', monospace" }}>
                        {day.rawDate}
                      </span>
                      <div className="w-full max-w-[44px] h-1.5 rounded-full bg-black/10 overflow-hidden mt-2">
                        <div
                          className="h-full rounded-full"
                          style={{
                            width: `${day.percentage}%`,
                            backgroundColor: isSelected ? '#52B788' : day.percentage >= 80 ? '#2D6A4F' : '#D97706',
                          }}
                        />
                      </div>
                    </button>
                  );
                })}
              </div>

              <div className="inline-flex p-1 rounded-2xl bg-[#EFECE6] border border-[#E7E2DA]">
                {[
                  { id: 'rhythm', label: 'Ритм и задачи' },
                  { id: 'sales', label: 'Лиды и Декомпозиция' },
                  { id: 'kazna', label: 'Казна и Стратегия' },
                ].map((tab) => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveSection(tab.id)}
                    className={`px-3.5 py-2 rounded-xl text-xs font-semibold transition-all ${
                      activeSection === tab.id ? 'bg-[#FFFDF9] text-[#1C1917] shadow-sm border border-[#E7E2DA]' : 'text-[#57534E]'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>
            </div>

            {/* ВКЛАДКА 1: РИТМ И ЗАДАЧИ */}
            {activeSection === 'rhythm' && (
              <main className="mt-7 grid grid-cols-1 lg:grid-cols-12 gap-7 items-start">
                <div className="lg:col-span-5 space-y-6">
                  <section className="bg-[#FFFDF9] border border-[#E7E2DA] rounded-3xl p-5 sm:p-6 shadow-sm">
                    <div className="flex items-center justify-between mb-4">
                      <h2 className="text-xl font-semibold text-[#1C1917]" style={{ fontFamily: "'Newsreader', Georgia, serif" }}>
                        Трекер привычек и спринт
                      </h2>
                      <button
                        onClick={() => setShowAddHabit(!showAddHabit)}
                        className="text-xs font-semibold px-3 py-1.5 rounded-xl bg-[#EFECE6] hover:bg-[#E5E0D8]"
                      >
                        + Привычка
                      </button>
                    </div>

                    {showAddHabit && (
                      <form onSubmit={handleAddHabit} className="mb-4 p-3.5 rounded-2xl bg-[#FAF8F5] border border-[#E7E2DA] space-y-2.5">
                        <input
                          type="text"
                          value={newHabitTitle}
                          onChange={(e) => setNewHabitTitle(e.target.value)}
                          placeholder="Название привычки..."
                          className="w-full px-3 py-2 text-sm bg-white border border-[#E7E2DA] rounded-xl"
                        />
                        <div className="flex items-center gap-2">
                          <input
                            type="number" min="1" max="10"
                            value={newHabitTarget}
                            onChange={(e) => setNewHabitTarget(e.target.value)}
                            className="w-16 px-2 py-1.5 text-xs bg-white border border-[#E7E2DA] rounded-xl text-center"
                          />
                          <button type="submit" className="ml-auto px-3.5 py-1.5 rounded-xl bg-[#2D6A4F] text-white text-xs font-semibold">
                            Сохранить
                          </button>
                        </div>
                      </form>
                    )}

                    <div className="space-y-2.5">
                      {habits.map((habit) => {
                        const currentVal = habit.history[selectedDay] || 0;
                        const isDone = currentVal >= habit.targetPerDay;
                        const { currentStreak } = getHabitStreak(habit);
                        const dayNote = habit.notes?.[selectedDay] || '';

                        return (
                          <div
                            key={habit.id}
                            className={`rounded-2xl border p-3.5 transition-all ${
                              isDone ? 'bg-[#F6FBF8] border-[#B7E4C7]' : 'bg-[#FAF8F5]/60 border-[#E7E2DA]'
                            }`}
                          >
                            <div className="flex items-start justify-between gap-3">
                              <div className="flex items-start gap-3">
                                <button
                                  onClick={() => toggleHabitProgress(habit.id, selectedDay)}
                                  className={`mt-0.5 w-7 h-7 rounded-xl flex items-center justify-center border font-bold text-xs ${
                                    isDone ? 'bg-[#2D6A4F] border-[#2D6A4F] text-white' : 'bg-white border-[#D6D0C4] text-transparent'
                                  }`}
                                >
                                  ✓
                                </button>
                                <div>
                                  <div className="flex flex-wrap items-center gap-1.5">
                                    <span className={`text-sm font-semibold ${isDone ? 'line-through text-[#78716C]' : 'text-[#1C1917]'}`}>
                                      {habit.title}
                                    </span>
                                    {habit.badgeNote && (
                                      <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-[#EFECE6] text-[#57534E]">
                                        {habit.badgeNote}
                                      </span>
                                    )}
                                  </div>
                                  <div className="flex items-center gap-2 mt-1 text-xs text-[#78716C]">
                                    <span>{habit.category}</span>
                                    <span>•</span>
                                    <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>
                                      {currentVal}/{habit.targetPerDay} {habit.unit}
                                    </span>
                                    {currentStreak > 0 && (
                                      <span className="text-[11px] font-semibold text-[#D97706] bg-[#FEF3C7] px-1.5 py-0.5 rounded-md">
                                        🔥 {currentStreak} дн.
                                      </span>
                                    )}
                                  </div>
                                </div>
                              </div>

                              <div className="flex items-center gap-1">
                                {habit.targetPerDay > 1 && (
                                  <div className="inline-flex items-center bg-white border border-[#E7E2DA] rounded-xl p-0.5">
                                    <button onClick={() => toggleHabitProgress(habit.id, selectedDay, -1)} className="w-6 h-6 text-xs font-bold">−</button>
                                    <span className="px-1.5 text-xs font-semibold">{currentVal}</span>
                                    <button onClick={() => toggleHabitProgress(habit.id, selectedDay, 1)} className="w-6 h-6 text-xs font-bold text-[#2D6A4F]">+</button>
                                  </div>
                                )}
                                <button
                                  onClick={() => setEditingNoteId(editingNoteId === habit.id ? null : habit.id)}
                                  className="px-2 py-1 rounded-lg text-xs text-[#78716C] hover:bg-[#EFECE6]"
                                >
                                  ✎
                                </button>
                                <button
                                  onClick={() => deleteHabit(habit.id)}
                                  className="px-1.5 py-1 rounded-lg text-xs text-[#A8A29E] hover:text-red-600"
                                >
                                  ✕
                                </button>
                              </div>
                            </div>

                            {(dayNote || editingNoteId === habit.id) && (
                              <div className="mt-2 pt-2 border-t border-[#E7E2DA]/70">
                                {editingNoteId === habit.id ? (
                                  <input
                                    type="text"
                                    value={dayNote}
                                    onChange={(e) => updateHabitNote(habit.id, e.target.value)}
                                    onBlur={() => setEditingNoteId(null)}
                                    onKeyDown={(e) => e.key === 'Enter' && setEditingNoteId(null)}
                                    autoFocus
                                    placeholder="Заметка за день..."
                                    className="w-full text-xs bg-white border border-[#D6D0C4] rounded-lg px-2.5 py-1.5"
                                  />
                                ) : (
                                  <div onClick={() => setEditingNoteId(habit.id)} className="text-xs text-[#57534E] italic cursor-pointer">
                                    «{dayNote}»
                                  </div>
                                )}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </section>

                  <section className="bg-[#FFFDF9] border border-[#E7E2DA] rounded-3xl p-5 sm:p-6 shadow-sm">
                    <div className="flex items-center justify-between mb-3">
                      <h2 className="text-xl font-semibold text-[#1C1917]" style={{ fontFamily: "'Newsreader', Georgia, serif" }}>
                        Фокус и задачи на {WEEK_DAYS[selectedDay].date}
                      </h2>
                      <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-[#ECFDF5] text-[#2D6A4F]">
                        {currentDayStats.completedTasks}/{currentDayStats.totalTasks}
                      </span>
                    </div>

                    <div className="space-y-2">
                      {(dailyGoals[selectedDay] || []).map((goal) => (
                        <div
                          key={goal.id}
                          onClick={() => toggleGoal(goal.id)}
                          className={`flex items-start justify-between gap-3 p-3 rounded-2xl border cursor-pointer ${
                            goal.done ? 'bg-[#F6FBF8] border-[#B7E4C7] text-[#78716C]' : 'bg-[#FAF8F5]/70 border-[#E7E2DA]'
                          }`}
                        >
                          <div className="flex items-start gap-2.5">
                            <span className="mt-0.5 text-sm font-bold text-[#2D6A4F]">{goal.done ? '✓' : '○'}</span>
                            <div>
                              <div className={`text-xs sm:text-sm font-medium ${goal.done ? 'line-through text-[#78716C]' : 'text-[#1C1917]'}`}>
                                {goal.text}
                              </div>
                              <span className="inline-block mt-1 text-[10px] font-semibold px-2 py-0.5 rounded-md bg-[#FEF3C7] text-[#B45309]">
                                {goal.tag}
                              </span>
                            </div>
                          </div>
                          <button
                            onClick={(e) => { e.stopPropagation(); deleteGoal(goal.id); }}
                            className="text-xs text-[#A8A29E] hover:text-red-600"
                          >
                            ✕
                          </button>
                        </div>
                      ))}
                    </div>

                    <form onSubmit={handleAddGoal} className="mt-4 flex gap-2">
                      <input
                        type="text"
                        value={newGoalText}
                        onChange={(e) => setNewGoalText(e.target.value)}
                        placeholder="Добавить задачу на день..."
                        className="flex-1 text-xs sm:text-sm px-3.5 py-2.5 rounded-xl bg-[#FAF8F5] border border-[#E7E2DA]"
                      />
                      <button type="submit" className="px-3.5 py-2.5 rounded-xl bg-[#1C1917] text-[#FAF8F5] text-xs font-semibold">
                        + В план
                      </button>
                    </form>
                  </section>
                </div>

                <div className="lg:col-span-7 space-y-6">
                  <section className="bg-[#FFFDF9] border border-[#E7E2DA] rounded-3xl p-5 sm:p-6 shadow-sm">
                    <div className="flex items-center justify-between mb-4">
                      <div>
                        <span className="text-xs font-semibold text-[#2D6A4F]">График серий достижений (12.10 – 18.10)</span>
                        <h2 className="text-xl font-semibold text-[#1C1917]" style={{ fontFamily: "'Newsreader', Georgia, serif" }}>
                          Импульс недели: привычки + продажи
                        </h2>
                      </div>
                      <span className="text-xs font-semibold bg-[#EFECE6] px-2.5 py-1 rounded-lg" style={{ fontFamily: "'JetBrains Mono', monospace" }}>
                        Среднее: {globalMetrics.avgCompletion}%
                      </span>
                    </div>

                    <div className="rounded-2xl bg-[#FAF8F5] border border-[#E7E2DA]/80 p-3">
                      <svg viewBox="0 0 560 165" className="w-full h-44 overflow-visible">
                        <defs>
                          <linearGradient id="neuroGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#2D6A4F" stopOpacity="0.26" />
                            <stop offset="100%" stopColor="#2D6A4F" stopOpacity="0.0" />
                          </linearGradient>
                        </defs>
                        {[25, 50, 75, 100].map((level) => {
                          const y = 24 + (165 - 48) * (1 - level / 100);
                          return (
                            <g key={level}>
                              <line x1="32" y1={y} x2="528" y2={y} stroke="#E7E2DA" strokeDasharray="3 3" />
                              <text x="4" y={y + 3} fontSize="9" fill="#A8A29E">{level}%</text>
                            </g>
                          );
                        })}
                        <path d={svgAreaPath} fill="url(#neuroGrad)" />
                        <path d={svgPath} fill="none" stroke="#2D6A4F" strokeWidth="3" strokeLinecap="round" />
                        {chartPoints.map((pt, idx) => {
                          const isSelected = idx === selectedDay;
                          return (
                            <g key={pt.id} className="cursor-pointer" onClick={() => setSelectedDay(idx)}>
                              <circle cx={pt.x} cy={pt.y} r={isSelected ? 7 : 4.5} fill={isSelected ? '#1C1917' : '#FFFDF9'} stroke="#2D6A4F" strokeWidth="2.5" />
                              <text x={pt.x} y={pt.y - 11} textAnchor="middle" fontSize="10" fontWeight="600" fill="#1C1917">{pt.percentage}%</text>
                              <text x={pt.x} y={161} textAnchor="middle" fontSize="10" fontWeight={isSelected ? '700' : '500'} fill={isSelected ? '#2D6A4F' : '#78716C'}>{pt.short}</text>
                            </g>
                          );
                        })}
                      </svg>
                    </div>
                  </section>

                  <section className="bg-[#FFFDF9] border border-[#E7E2DA] rounded-3xl p-5 sm:p-6 shadow-sm">
                    <h2 className="text-xl font-semibold text-[#1C1917] mb-1" style={{ fontFamily: "'Newsreader', Georgia, serif" }}>
                      Матрица серий недели (Streak Chains)
                    </h2>
                    <p className="text-xs text-[#78716C] mb-4">Кликните по любой ячейке, чтобы отметить привычку за день</p>

                    <div className="divide-y divide-[#EFECE6]">
                      {habits.map((habit) => {
                        const { bestStreak } = getHabitStreak(habit);
                        return (
                          <div key={habit.id} className="grid grid-cols-12 items-center gap-2 py-2.5">
                            <div className="col-span-5 pr-2">
                              <div className="text-xs sm:text-sm font-medium text-[#1C1917] truncate">{habit.title}</div>
                              <div className="text-[11px] text-[#78716C]">{habit.category}</div>
                            </div>
                            <div className="col-span-5 grid grid-cols-7 items-center">
                              {WEEK_DAYS.map((d, idx) => {
                                const val = habit.history[idx] || 0;
                                const done = val >= habit.targetPerDay;
                                const partial = val > 0 && val < habit.targetPerDay;
                                const prevDone = idx > 0 && (habit.history[idx - 1] || 0) >= habit.targetPerDay;
                                const nextDone = idx < 6 && (habit.history[idx + 1] || 0) >= habit.targetPerDay;
                                return (
                                  <button
                                    key={d.id}
                                    onClick={() => toggleHabitProgress(habit.id, idx)}
                                    className={`h-7 flex items-center justify-center text-[11px] font-semibold transition-all ${
                                      done
                                        ? `bg-[#2D6A4F] text-white ${prevDone ? 'rounded-l-none' : 'rounded-l-xl ml-0.5'} ${nextDone ? 'rounded-r-none' : 'rounded-r-xl mr-0.5'}`
                                        : partial
                                        ? 'bg-[#FEF3C7] text-[#B45309] rounded-xl mx-0.5'
                                        : 'bg-[#EFECE6]/70 text-[#A8A29E] rounded-xl mx-0.5'
                                    }`}
                                  >
                                    {done ? '✓' : partial ? val : '·'}
                                  </button>
                                );
                              })}
                            </div>
                            <div className="col-span-2 text-right">
                              <span className="px-2 py-0.5 rounded-full text-xs font-semibold bg-[#FEF3C7] text-[#D97706]">
                                🔥 {bestStreak}д
                              </span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </section>
                </div>
              </main>
            )}

            {/* ВКЛАДКА 2: ПРОДАЖИ И ДЕКОМПОЗИЦИЯ */}
            {activeSection === 'sales' && (
              <section className="mt-7 grid grid-cols-1 lg:grid-cols-12 gap-7 items-start">
                <div className="lg:col-span-5 bg-[#FFFDF9] border border-[#E7E2DA] rounded-3xl p-6 shadow-sm space-y-4">
                  <h2 className="text-2xl font-semibold text-[#1C1917]" style={{ fontFamily: "'Newsreader', Georgia, serif" }}>
                    Калькулятор декомпозиции
                  </h2>
                  <div className="flex gap-2">
                    {[20000, 30000, 50000].map((val) => (
                      <button
                        key={val}
                        onClick={() => setTargetRevenue(val)}
                        className={`flex-1 py-2 rounded-xl text-xs font-semibold border ${targetRevenue === val ? 'bg-[#1C1917] text-white' : 'bg-[#FAF8F5]'}`}
                      >
                        Цель: {val / 1000}к ₽
                      </button>
                    ))}
                  </div>
                  <div className="flex gap-2">
                    {[2500, 4000, 5000, 10000].map((price) => (
                      <button
                        key={price}
                        onClick={() => setTicketPrice(price)}
                        className={`flex-1 py-2 rounded-xl text-xs font-semibold border ${ticketPrice === price ? 'bg-[#2D6A4F] text-white' : 'bg-[#FAF8F5]'}`}
                      >
                        Чек: {price} ₽
                      </button>
                    ))}
                  </div>
                  <div className="p-4 rounded-2xl bg-[#FAF8F5] border border-[#E7E2DA] flex items-center justify-between">
                    <span className="text-xs text-[#57534E]">Нужно закрыть клиентов:</span>
                    <span className="text-2xl font-bold text-[#2D6A4F]">{Math.ceil(targetRevenue / ticketPrice)} чел.</span>
                  </div>
                </div>

                <div className="lg:col-span-7 bg-[#FFFDF9] border border-[#E7E2DA] rounded-3xl p-6 shadow-sm">
                  <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
                    <h2 className="text-2xl font-semibold text-[#1C1917]" style={{ fontFamily: "'Newsreader', Georgia, serif" }}>
                      База клиентов (клик по статусу меняет этап)
                    </h2>
                    <div className="flex gap-1.5">
                      {['Все', 'Дожим', 'Договорились', 'Оплатил'].map((st) => (
                        <button
                          key={st}
                          onClick={() => setStatusFilter(st)}
                          className={`px-3 py-1 rounded-xl text-xs font-semibold ${statusFilter === st ? 'bg-[#1C1917] text-white' : 'bg-[#FAF8F5] border border-[#E7E2DA]'}`}
                        >
                          {st}
                        </button>
                      ))}
                    </div>
                  </div>
                  <div className="space-y-2.5">
                    {filteredLeads.map((lead) => (
                      <div key={lead.id} className="flex items-center justify-between gap-3 p-3.5 rounded-2xl bg-[#FAF8F5] border border-[#E7E2DA]">
                        <div>
                          <div className="text-sm font-semibold text-[#1C1917]">{lead.name} <span className="text-xs text-[#2D6A4F]">{lead.handle}</span></div>
                          <div className="text-xs text-[#57534E]">{lead.comment} • След. касание: {lead.nextTouch}</div>
                        </div>
                        <button
                          onClick={() => cycleLeadStatus(lead.id)}
                          className={`px-3 py-1.5 rounded-xl text-xs font-semibold ${
                            lead.status === 'Оплатил' ? 'bg-[#2D6A4F] text-white' : 'bg-[#FEF3C7] text-[#B45309]'
                          }`}
                        >
                          {lead.status} ↻
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              </section>
            )}

            {/* ВКЛАДКА 3: КАЗНА И СТРАТЕГИЯ */}
            {activeSection === 'kazna' && (
              <section className="mt-7 grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="bg-[#FFFDF9] border border-[#E7E2DA] rounded-3xl p-6 shadow-sm">
                  <h3 className="text-xl font-semibold text-[#1C1917] mb-3" style={{ fontFamily: "'Newsreader', Georgia, serif" }}>
                    KAZNA • Нужды / Броня
                  </h3>
                  <div className="space-y-2">
                    {kazna.needs.map((n) => (
                      <div
                        key={n.id}
                        onClick={() => toggleKaznaNeed(n.id)}
                        className="flex items-center justify-between p-3 rounded-xl bg-[#FAF8F5] border border-[#E7E2DA] cursor-pointer"
                      >
                        <span className={`text-xs font-medium ${n.done ? 'line-through text-[#78716C]' : 'text-[#1C1917]'}`}>
                          {n.done ? '✓ ' : '○ '} {n.title}
                        </span>
                        <span className="text-xs font-semibold text-[#2D6A4F]">{n.amount}</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="bg-[#FFFDF9] border border-[#E7E2DA] rounded-3xl p-6 shadow-sm">
                  <h3 className="text-xl font-semibold text-[#1C1917] mb-3" style={{ fontFamily: "'Newsreader', Georgia, serif" }}>
                    Стратегия 2026–2027
                  </h3>
                  <div className="space-y-3">
                    {STRATEGY_TRACKS.map((tr, i) => (
                      <div key={i} className="p-3.5 rounded-2xl bg-[#FAF8F5] border border-[#E7E2DA]">
                        <div className="text-sm font-semibold text-[#1C1917]">{tr.name}</div>
                        <div className="text-xs text-[#78716C] mb-2">{tr.subtitle}</div>
                        {tr.steps.slice(0, 3).map((st, j) => (
                          <div key={j} className="text-xs py-1 border-t border-[#E7E2DA]/60">
                            <strong>{st.period}:</strong> {st.goal}
                          </div>
                        ))}
                      </div>
                    ))}
                  </div>
                </div>
              </section>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
